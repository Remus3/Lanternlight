; Lanternlight - pytest configuration.
;
; This file is the ONLY pytest config in the repo. pyproject.toml deliberately
; carries no [tool.pytest.ini_options] table; see the comment at the top of
; pyproject.toml for why.
;
; Stock pytest only - no plugin is assumed to be installed, so nothing here
; references xdist, cov, timeout, asyncio or any other third-party option. A
; plugin option in an ini file is a hard collection error when the plugin is
; missing, which would make a fresh clone fail before running a single test.

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; -q            quiet-ish: one char per test, no per-file header spam
; --tb=short    enough traceback to act on, not a screenful
; --strict-markers   an unregistered marker is an error, not a silent no-op
; --strict-config    a typo in this file is an error, not a silent no-op
; -r fE         summarize failures and errors at the end
addopts = -q --tb=short --strict-markers --strict-config -r fE

; THIS SUITE CLEANS UP AFTER ITSELF. Both options are stock pytest, not a
; plugin. Measured 2026-09-20, same 88 tests, isolated base directories:
; policy=all left 589 files and 401 dirs, policy=failed left 175 and 236.
;
; 'failed' keeps the directory of a test that FAILED, because that directory is
; the evidence someone will want, and removes the rest at teardown.
;
; The count equals the stock default and is pinned anyway, so a future pytest
; changing its own default cannot quietly change what this repository leaves on
; the operator's disk.
;
; The measurement behind both, including why a machine-wide sweep expressed in
; DAYS can never catch this, is in tests/test_tmp_retention.py. Read it before
; deleting these two lines.
tmp_path_retention_policy = failed
tmp_path_retention_count = 3

; Register markers here as they are needed. An unregistered marker fails under
; --strict-markers, which is the point: a typo'd marker silently selects
; nothing otherwise.
markers =
    slow: test is slow enough that it should be skippable with -m "not slow"

; Warnings are visible but never fatal at this stage of the project.
filterwarnings =
    default
