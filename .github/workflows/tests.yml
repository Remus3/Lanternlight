# Lanternlight - continuous integration.
#
# This runs the same command a developer runs: `python -m pytest` from the
# repository root, bare. Not `-q`. pytest.ini already carries `-q` in addopts,
# so a second one makes it `-qq`, which prints NO SUMMARY LINE AT ALL and still
# exits 0. A CI job that cannot print its own count is a green tick with
# nothing behind it.
#
# Windows-only on purpose. This project reads a Windows game's files, imports
# ctypes.wintypes, and its overlay is a Win32 window. A Linux job would be
# testing something nobody runs.
#
# WHY PILLOW IS INSTALLED HERE AND NOT DECLARED IN pyproject.toml
# ---------------------------------------------------------------
# The first run of this workflow failed, and it failed usefully:
# tests/test_vision_meter.py::TestTheCommittedFixture
# ::test_a_clone_can_verify_a_SUCCESSFUL_read_not_only_refusals died on
# `ModuleNotFoundError: No module named 'PIL'`. That test's own docstring says
# "Never skips" - it exists precisely to prove a FRESH CLONE can perform a real
# read against the committed fixture rather than only verifying refusals. So
# the correct response was to give the clone Pillow, never to skip the test.
# Every other Pillow use in the suite does sit behind
# `pytest.importorskip("PIL")`; this one is deliberately not one of them.
#
# It is installed here rather than added to pyproject.toml because that file
# has NO [build-system] table, by a documented decision: Lanternlight runs from
# a checkout, not a wheel, and the file says an optional-dependencies table
# nothing can consume would "advertise a packaging story that does not exist".
# So `dependencies = []` stays literally true of the core, and the vision
# path's one real requirement is declared where it is actually installed.
#
# WHAT THE BADGE DOES AND DOES NOT MEAN
# -------------------------------------
# A runner has no Mistfall Hunter install, no save tree and none of the
# operator's reference captures, so several dozen tests SKIP here that pass on
# a developer machine. Green means the machine-independent suite passes on a
# clean checkout. It does not mean the capture-joined tests ran.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      # Pinned to exact tags, not moving majors. v4/v5 were also emitting a
      # Node 20 deprecation warning on this runner image.
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pillow

      - name: Report the collected count before running
        run: python -m pytest --collect-only 2>&1 | tail -3
        shell: bash

      - name: Run the suite
        run: python -m pytest
