# Lanternlight - ruff configuration.
#
# This file is the ONLY ruff config in the repo. pyproject.toml deliberately
# carries no [tool.ruff] table; see the comment at the top of pyproject.toml.

line-length = 100
target-version = "py314"
src = ["."]
extend-exclude = [
    ".venv",
    "venv",
    "scratchpad",
    "_scratch",
    "data",
    # OPS-84. Vendored third-party work, kept byte-identical to what was
    # licensed. Linting it would be pointless at best and harmful at worst:
    # ruff's PTH rules want `builtins.open` and `os.replace` in
    # third_party/lw_write_tracer/ rewritten to their pathlib equivalents, and
    # those two calls are the PATCHED ROUTES its own positive control exists to
    # exercise - rewriting them would silently disarm the control. Editing it
    # would also make it a derivative work needing a declared change, which
    # third_party/lw_write_tracer/NOTICE.md and
    # tests/test_vendored_write_tracer.py both say plainly. We do not lint code
    # we are not going to modify.
    "third_party",
]

[lint]
# E/W  pycodestyle      - whitespace and formatting errors
# F    pyflakes         - undefined names, unused imports, real bugs
# I    isort            - import ordering, kept mechanical so it never diffs
# UP   pyupgrade        - the project is 3.14-only, so legacy syntax is noise
# B    flake8-bugbear   - the genuinely dangerous patterns (mutable defaults,
#                         except-without-raise-from, loop-variable capture)
# C4   comprehensions   - list(...)/dict(...) wrappers that should be literals
# SIM  flake8-simplify  - collapsible ifs, redundant bool conversions
# PTH  flake8-use-pathlib - os.path drift; this project is pathlib-first
# RUF  ruff-native      - misc correctness lints
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PTH", "RUF"]

ignore = [
    # Formatter's job, and it fights black-style trailing commas.
    "E203",
    # Ambiguous unicode is impossible here - the repo is ASCII-only by rule and
    # by pre-commit hook - so this rule can only ever fire as a false positive.
    "RUF001",
    "RUF002",
    "RUF003",
    # Insists on isort-style ordering inside __all__, which interleaves
    # SCREAMING_CASE constants with lowercase callables and reads worse than a
    # hand-grouped list. Cosmetic, opinionated, and not worth a red build.
    "RUF022",
]

[lint.per-file-ignores]
# Tests get to be repetitive and to shadow names in fixtures.
"tests/**" = ["B011"]
# Package markers are allowed to be empty or re-export.
"**/__init__.py" = ["F401"]

[lint.isort]
known-first-party = ["lanternlight", "emberforge"]
combine-as-imports = true

[lint.pydocstyle]
convention = "google"

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
